<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Thesisweb</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdfcf0;
        --text: #1c1b18;
        --muted: #5f5b50;
        --line: #ccc8b4;
        --accent: #684c96;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191816;
          --text: #f2eee4;
          --muted: #a8a294;
          --line: #3a372f;
          --accent: #b79be8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 Georgia, "Times New Roman", serif;
      }
      main { max-width: 34rem; }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--muted);
        font: 600 11px/1.2 system-ui, sans-serif;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 40px); font-weight: 500; }
      p { margin: 0 0 20px; color: var(--muted); }
      a {
        display: inline-block;
        padding: 9px 16px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        color: var(--accent);
        text-decoration: none;
        font: 600 14px/1 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Thesisweb</p>
      <h1>You are offline</h1>
      <p>This page hasn't been opened on this device yet. Reconnect and reload, or go back to a page you've already visited.</p>
      <a href="/">Go to the home page</a>
    </main>
  </body>
</html>
