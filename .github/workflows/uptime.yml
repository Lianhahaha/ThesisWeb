name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the production health endpoint
        run: curl --fail --silent --show-error --max-time 20 https://thesiswebph.vercel.app/api/health
